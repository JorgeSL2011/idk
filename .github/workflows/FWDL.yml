name: Download Firmware

on:
  workflow_dispatch:
    inputs:
      ap_url:
        description: "SamFW AP download link"
        required: true
        type: string

jobs:
  Download:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 p7zip-full curl jq

      - name: Download AP
        run: |
          curl -L "${{ github.event.inputs.ap_url }}" -o AP.zip

      - name: Extract AP.zip
        run: |
          7z x AP.zip -oap_files -y
          rm AP.zip

      - name: Find and extract AP tar.md5
        run: |
          AP_TAR=$(find ap_files -name "AP*.tar.md5" | head -n 1)

          if [ -z "$AP_TAR" ]; then
            echo "❌ No AP tar.md5 found!"
            find ap_files
            exit 1
          fi

          echo "📂 Found: $AP_TAR"

          mkdir -p ap_tar
          tar -xf "$AP_TAR" -C ap_tar

          echo "📋 Extracted files:"
          find ap_tar -maxdepth 1 -type f

          rm -rf ap_files

      - name: Decompress super image
        run: |
          if [ -f ap_tar/super.img.lz4 ]; then
            echo "🗜️ Found super.img.lz4"
            lz4 -d -f ap_tar/super.img.lz4 super.img

          elif [ -f ap_tar/super.img ]; then
            echo "📦 Found raw super.img"
            mv ap_tar/super.img super.img

          else
            echo "❌ No super image found"
            find ap_tar
            exit 1
          fi

          rm -rf ap_tar

          ls -lh super.img

      - name: Upload to Gofile
        id: gofile
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')

          RESPONSE=$(curl -s \
            -F "file=@super.img" \
            "https://${SERVER}.gofile.io/uploadFile")

          echo "$RESPONSE"

          DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')

          echo "download_link=$DOWNLOAD_LINK" >> $GITHUB_OUTPUT

      - name: Show download link
        run: |
          echo "Gofile Link:"
          echo "${{ steps.gofile.outputs.download_link }}"
