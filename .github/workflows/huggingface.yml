name: 🚀 Descargar AP y Subir Super a Hugging Face

on:
  workflow_dispatch:
    inputs:
      ap_url:
        description: "Enlace directo de descarga de SamFW AP / Firmware"
        required: true
        type: string

jobs:
  Download_and_Push:
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Maximizar Espacio en Disco del Runner
        # Eliminamos software preinstalado innecesario para garantizar ~35GB libres en Azure
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          echo "✅ Espacio optimizado para la extracción de firmware pesado."

      - name: 🔧 Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 p7zip-full curl python3-pip
          pip install --break-system-packages huggingface_hub
          echo "✅ Dependencias de sistema y Hugging Face CLI listas."

      - name: 📥 Descargar AP
        run: |
          echo "- Descargando el archivo AP de SamFW a máxima velocidad..."
          # Usamos curl emulando un navegador básico por si SamFW tiene bloqueos de User-Agent
          curl -L -H "User-Agent: Mozilla/5.0" "${{ github.event.inputs.ap_url }}" -o AP.zip
          echo "✅ Descarga del ZIP finalizada."
          ls -lh AP.zip

      - name: 📦 Extraer AP.zip
        run: |
          echo "- Abriendo el paquete comprimido..."
          7z x AP.zip -oap_files -y > /dev/null
          rm -f AP.zip # Liberar espacio del zip inmediatamente
          echo "✅ Extracción del AP lista."

      - name: 📂 Encontrar y desarmar AP tar.md5
        run: |
          AP_TAR=$(find ap_files -name "AP*.tar.md5" -o -name "AP*.tar" | head -n 1)

          if [ -z "$AP_TAR" ]; then
            echo "❌ No se encontró el contenedor AP tar.md5!"
            find ap_files
            exit 1
          fi

          echo "📂 Contenedor detectado: $AP_TAR"
          mkdir -p ap_tar
          
          # Extraer UNICAMENTE el super.img / super.img.lz4 del tar para no saturar el almacenamiento
          echo "- Extrayendo selectivamente los bloques del super..."
          tar -xf "$AP_TAR" -C ap_tar --wildcards "*super.img*" || tar -xf "$AP_TAR" -C ap_tar
          
          echo "📋 Archivos obtenidos del tar:"
          find ap_tar -maxdepth 1 -type f
          rm -rf ap_files # Destruir el resto de archivos .tar y md5 para recuperar gigabytes

      - name: 🗜️ Descomprimir e Indexar Imagen Super
        run: |
          if [ -f ap_tar/super.img.lz4 ]; then
            echo "🗜️ Descomprimiendo bloque lz4 de Samsung..."
            lz4 -d -f ap_tar/super.img.lz4 super.img
          elif [ -f ap_tar/super.img ]; then
            echo "📦 Moviendo super.img crudo..."
            mv ap_tar/super.img super.img
          else
            echo "❌ Error: ¡No hay rastro del super.img!"
            exit 1
          fi
          rm -rf ap_tar

      - name: 🛠️ Compilar/Instalar lpunpack y Rebanar Super.img
        run: |
          echo "- 🔧 Consiguiendo herramientas de particiones dinámicas..."
          # Descargamos un lpunpack binario rápido para Linux de 64 bits
          wget https://github.com/lonelyfool/lpunpack_and_lpmake/releases/download/v1.0/lpunpack -O lpunpack
          chmod +x lpunpack
          
          mkdir -p particiones_sueltas
          echo "- 🗜️ Desarmando super.img en imágenes lógicas individuales..."
          ./lpunpack -o particiones_sueltas/ super.img
          
          echo "📋 Archivos extraídos del super:"
          ls -lh particiones_sueltas/
          rm -f super.img lpunpack # Borramos los pesados del mapa

      - name: 🤐 Empacar imágenes sueltas en un ZIP
        run: |
          echo "- 📦 Creando particiones.zip..."
          # Comprimimos la carpeta con las imágenes sueltas. 
          # Al estar separadas, 7z eliminará el espacio vacío interno de system e imágenes de forma radical.
          7z a -mx=1 particiones.zip ./particiones_sueltas/*
          
          echo "📋 Tamaño final del paquete comprimido listo para Hugging Face:"
          ls -lh particiones.zip
          rm -rf particiones_sueltas

      - name: 📤 Subir ZIP de Particiones a Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          repo_id = 'Jooseph2011/Firmware'
          
          if not token:
              print('❌ Error: HF_TOKEN no configurado.')
              exit(1)
              
          api = HfApi(token=token)
          print('- 🚀 Subiendo particiones.zip optimizado a Hugging Face...')
          
          api.upload_file(
              path_or_fileobj='particiones.zip',
              path_in_repo='particiones.zip',
              repo_id=repo_id,
              repo_type='dataset'
          )
          print('- 🎉 ¡Subida del ZIP de imágenes completada con éxito!')
          "
